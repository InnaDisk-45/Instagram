name: Ежедневная публикация

on:
  schedule:
    - cron: "0 7 * * *"   # 07:00 UTC = 10:00 по Москве (GitHub иногда запускает с опозданием до ~15–30 мин)
  workflow_dispatch:       # кнопка «Run workflow» для ручного запуска
    inputs:
      network:
        description: "Куда публиковать: all, instagram или telegram"
        default: "all"

permissions:
  contents: write

concurrency: publish

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - name: Публикация
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
        run: python publish.py "${{ github.event.inputs.network || 'all' }}"
      - name: Сохранить отметку о публикации
        if: always()
        run: |
          git config user.name "autopublish-bot"
          git config user.email "actions@users.noreply.github.com"
          git add published.json
          if [ -f last_run.txt ]; then git add last_run.txt; fi
          git diff --cached --quiet || (git commit -m "Опубликовано: $(date +%d.%m)" && git push)
