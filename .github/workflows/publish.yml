name: Ежедневная публикация

on:
  schedule:
    # Время нарочно не «круглое»: на 00 минут GitHub перегружен, опаздывает на часы
    # или вовсе пропускает запуск. Второй запуск — запасной: если первый уже
    # опубликовал пост сегодня, второй ничего не делает.
    - cron: "37 6 * * *"   # 06:37 UTC = 09:37 по Москве (обычно выходит около 10:00)
    - cron: "23 9 * * *"   # 09:23 UTC = 12:23 по Москве — запасной
  workflow_dispatch:       # кнопка «Run workflow» для ручного запуска
    inputs:
      network:
        description: "Куда публиковать: all, instagram или telegram"
        default: "all"

permissions:
  contents: write

concurrency: publish

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - name: Публикация
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
        run: python publish.py "${{ github.event.inputs.network || 'all' }}"
      - name: Сохранить отметку о публикации
        if: always()
        run: |
          git config user.name "autopublish-bot"
          git config user.email "actions@users.noreply.github.com"
          git add published.json
          if [ -f last_run.txt ]; then git add last_run.txt; fi
          git diff --cached --quiet || (git commit -m "Опубликовано: $(date +%d.%m)" && git push)
